name: Claude Code
on:
  # Interactive: respond to @claude mentions in PR/issue comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Automated: review PRs on open/update/ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for git diff against base branch

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          include_fix_links: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request using a structured severity-based approach:

            ## Critical (must fix)
            - Memory safety: buffer overflows, use-after-free, dangling pointers
            - Thread safety: data races, missing locks, lock ordering violations
            - Security: injection, credential leaks, unsafe deserialization

            ## Major (should fix)
            - Logic errors, off-by-one, integer overflow/truncation
            - Resource leaks (sockets, file descriptors, memory)
            - Missing error handling on I/O or system calls
            - Concurrency: potential deadlocks, missing atomics

            ## Minor (nice to fix)
            - C++17 idioms: prefer std::optional, structured bindings, string_view
            - Naming consistency, redundant code, unclear intent
            - Performance: unnecessary copies, allocations in hot paths

            Post a summary comment via `gh pr comment` with:
            1. One-line verdict (approve / request changes)
            2. Grouped findings by severity
            3. Positive observations worth keeping

            Only post the review via `mcp__github_comment__update_claude_comment` — don't submit review text as plain messages.

          claude_args: |
            --max-turns 20
            --system-prompt "You are reviewing a C++17 multiroom audio streaming server (snapcast/santcasp). Key context: DoubleBuffer is NOT thread-safe — callers must hold mutex. The struct tv fields (sec, usec) are int32_t (signed). Boost.Asio strands serialize handler execution. Focus on real bugs over style nits. When unsure, say so rather than filing a false positive."
            --allowedTools "mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
