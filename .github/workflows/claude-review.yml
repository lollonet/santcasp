name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),View,GlobTool,GrepTool,BatchTool"'
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.
            Run `gh pr diff ${{ github.event.pull_request.number }}` to read the changes,
            then post your review with `gh pr review ${{ github.event.pull_request.number }} --comment --body "YOUR REVIEW"`.
            Focus on: bugs, thread safety, security, C++ best practices, performance.
            Be concise. Do not run any other commands first.
